services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/instance/parts.db
    volumes:
      - ./instance:/app/instance
    ports:
      # Host port is WEB_PORT in .env (default 5000).
      - "${WEB_PORT:-5000}:5000"
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    env_file: .env
    environment:
      PMS_API_BASE_URL: http://web:5000
    depends_on:
      - web
    ports:
      # Host port is MCP_PUBLIC_PORT in .env (default 8000).
      - "${MCP_PUBLIC_PORT:-8000}:${MCP_PORT:-8000}"
    restart: unless-stopped
